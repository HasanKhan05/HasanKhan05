<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Animated AI security lab</title>
  <desc id="desc">An animated network connects AI models, data, software, and security through a central intelligent systems node.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#1C1C1C" />
      <stop offset="0.5" stop-color="#666666" stop-opacity="0.28" />
      <stop offset="1" stop-color="#1C1C1C" />
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#666666" />
      <stop offset="0.7" stop-color="#1C1C1C" />
      <stop offset="1" stop-color="#FF7A00" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="22" fill="url(#panel)" stroke="#666666" stroke-width="2" />
  <text x="450" y="38" fill="#D3D3D3" font-family="monospace" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="3">AI SECURITY LAB // SIGNAL MAP</text>
  <line x1="52" y1="54" x2="848" y2="54" stroke="#666666" stroke-width="1" />

  <g fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="8 8">
    <path d="M170 145 L380 145">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M520 145 L730 145">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="2.2s" repeatCount="indefinite" />
    </path>
    <path d="M405 198 L310 238">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" repeatCount="indefinite" />
    </path>
    <path d="M495 198 L590 238">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>

  <g font-family="monospace" text-anchor="middle">
    <g>
      <rect x="55" y="107" width="115" height="76" rx="16" fill="#1C1C1C" stroke="#FF7A00" stroke-width="2" />
      <text x="112" y="138" fill="#FF7A00" font-size="14" font-weight="700">AI MODELS</text>
      <text x="112" y="160" fill="#D3D3D3" font-size="11">reason • learn</text>
    </g>
    <g>
      <rect x="730" y="107" width="115" height="76" rx="16" fill="#1C1C1C" stroke="#FF7A00" stroke-width="2" />
      <text x="787" y="138" fill="#FF7A00" font-size="14" font-weight="700">SECURITY</text>
      <text x="787" y="160" fill="#D3D3D3" font-size="11">test • defend</text>
    </g>
    <g>
      <rect x="228" y="221" width="135" height="56" rx="14" fill="#1C1C1C" stroke="#666666" stroke-width="2" />
      <text x="295" y="246" fill="#FF7A00" font-size="14" font-weight="700">DATA</text>
      <text x="295" y="264" fill="#D3D3D3" font-size="10">measure • verify</text>
    </g>
    <g>
      <rect x="537" y="221" width="135" height="56" rx="14" fill="#1C1C1C" stroke="#666666" stroke-width="2" />
      <text x="604" y="246" fill="#FF7A00" font-size="14" font-weight="700">SOFTWARE</text>
      <text x="604" y="264" fill="#D3D3D3" font-size="10">build • ship</text>
    </g>
  </g>

  <circle cx="450" cy="145" r="78" fill="none" stroke="#FF7A00" stroke-width="2" opacity="0.18">
    <animate attributeName="r" values="66;84;66" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.42;0.08" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="145" r="61" fill="url(#hub)" stroke="#FF7A00" stroke-width="3" filter="url(#glow)" />
  <text x="450" y="135" fill="#D3D3D3" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">INTELLIGENT</text>
  <text x="450" y="155" fill="#FF7A00" font-family="monospace" font-size="17" font-weight="700" text-anchor="middle">SYSTEMS</text>
  <text x="450" y="175" fill="#D3D3D3" font-family="monospace" font-size="9" text-anchor="middle">SECURE BY DESIGN</text>

  <g fill="#FF7A00" filter="url(#glow)">
    <circle r="5">
      <animateMotion path="M170 145 L380 145" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="5">
      <animateMotion path="M730 145 L520 145" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle r="4">
      <animateMotion path="M310 238 L405 198" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="4">
      <animateMotion path="M590 238 L495 198" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
